name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Vitest 4 needs Node 20+; on 18 the package is still smoke-tested below.
      - run: npm test
        if: matrix.node-version != '18.x'
      - run: npm run build
      - name: Smoke-test the built package
        run: >-
          node --input-type=module -e "import { normalizeEmailText } from './dist/index.js';
          if (normalizeEmailText('R&nbsp;1.00') !== 'R 1.00') process.exit(1);"
