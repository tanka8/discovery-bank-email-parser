name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x, 24.x]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Vitest 5 needs Node 22.12+, so the unit tests run on 22 and 24 only. On 18 and 20
      # the package is still typechecked, built and smoke-tested below. Keep every matrix
      # entry: the "Protect main" ruleset requires the checks "test (18.x)" to "test (24.x)".
      - run: npm test
        if: matrix.node-version == '22.x' || matrix.node-version == '24.x'
      - run: npm run build
      - name: Smoke-test the built package
        run: >-
          node --input-type=module -e "import { normalizeEmailText } from './dist/index.js';
          if (normalizeEmailText('R&nbsp;1.00') !== 'R 1.00') process.exit(1);"
